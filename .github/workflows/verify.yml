name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build release libraries
        run: ./gradlew --no-daemon verify :core:jar :android-runtime:assembleRelease :diagnostics-ui:assembleRelease :sample:run
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release libraries
        uses: actions/upload-artifact@v4
        with:
          name: background-service-libraries
          path: |
            core/build/libs/*.jar
            android-runtime/build/outputs/aar/*-release.aar
            diagnostics-ui/build/outputs/aar/*-release.aar
          if-no-files-found: error
          retention-days: 14
